name: Publish probability atlas

on:
  push:
    branches: [main]
    paths:
      - updates/archive-*.b64
      - updates/compact-spreads.patch
      - updates/storytelling.patch
      - updates/galton-reader.patch
      - updates/huygens-axis.patch
      - updates/testing-story.patch
      - updates/statistics-editorial.patch
      - atlas-editorial.js
      - atlas-statistics.js
      - atlas-statistics.css
      - scripts/build.py
      - tests/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare verified atlas
        run: |
          python3 scripts/build.py
          node tests/check-atlas.mjs
          node tests/atlas-statistics.test.cjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
